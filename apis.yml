aid: oneapm
name: OneAPM
description: >-
  OneAPM (Beijing Blueware Technology / 北京蓝海讯通科技) is a Chinese application
  performance management and intelligent IT operations vendor founded in 2008.
  Its product suite instruments applications and infrastructure end to end:
  Application Insight (server-side, code-level tracing for Java, .NET, PHP,
  Python, Node.js, Ruby and Go), Browser Insight and Mobile Insight (real user
  monitoring), Infrastructure Insight and Network Insight, LogInsight for log
  analytics, Cloud Alert (OneAlert) for intelligent alerting, Cloud Test for
  performance testing, OneITSM for IT service management, and the Intelligence
  Insight (I²) AIOps platform. It serves over 60,000 enterprise users across
  telecommunications, finance, government, transportation, energy and
  e-commerce, delivered as SaaS or on-premise, and instruments applications via
  language-specific agents (SDKs) published to npm, RubyGems and a private index.
